name: Synthetic teaching lab

on:
  pull_request:
    paths:
      - 'teaching/**'
      - 'docs/community/WINNER_SELECTION_LAB.md'
      - '.github/workflows/teaching-ci.yml'
  push:
    branches: [main]
    paths:
      - 'teaching/**'
      - 'docs/community/WINNER_SELECTION_LAB.md'
      - '.github/workflows/teaching-ci.yml'

permissions:
  contents: read

jobs:
  teaching:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s teaching -p test_selection_bias.py
      - run: python teaching/selection_bias.py --candidates 100 --seed 20261003 > selection-report.json
